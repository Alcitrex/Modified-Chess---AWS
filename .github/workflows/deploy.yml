name: Deploy to S3

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::6203-3986-9704:role/github-deployer
          aws-region: us-east-1

      - name: Upload site to S3
        run: |
          aws s3 sync . s3://YOUR-BUCKET --delete \
            --exclude ".git/*" --exclude ".github/*" --exclude "README.md"
