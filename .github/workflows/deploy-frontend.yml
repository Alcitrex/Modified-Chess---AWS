name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      STACK_NAME: ChessStack
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::620339869704:role/group1-project-role
          aws-region: us-east-1

      # Infra is owned by the backend workflow; fail clearly if it hasn't run yet.
      - name: Read stack outputs
        run: |
          out() {
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          for key in SiteBucketName DistributionId ApiUrl UserPoolId UserPoolClientId; do
            val=$(out "$key")
            if [ -z "$val" ] || [ "$val" = "None" ]; then
              echo "::error::Stack $STACK_NAME missing output $key. Run the backend deploy first."
              exit 1
            fi
          done
          {
            echo "SITE_BUCKET=$(out SiteBucketName)"
            echo "DISTRIBUTION_ID=$(out DistributionId)"
            echo "VITE_API_URL=$(out ApiUrl)"
            echo "VITE_USER_POOL_ID=$(out UserPoolId)"
            echo "VITE_USER_POOL_CLIENT_ID=$(out UserPoolClientId)"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Sync build output to S3
        run: aws s3 sync frontend/dist/ "s3://$SITE_BUCKET" --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
